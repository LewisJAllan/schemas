syntax = "proto3";

option go_package = "https://github.com/LewisJAllan/schemas/blob/master/accountregistrar/v1beta1";
package accountregistrar;

// The greeting service definition.
service AccountRegistrarService {
  // Login Sends a request to access a user account and actions
  rpc SignUp (SignUpRequest) returns (SignUpResponse) {}
}

// The request message containing the user's name.
message SignUpRequest {
  // username should be unique per user
  string username = 1;
  // password is an encrypted value created by the user
  string password = 2;
  // first_name represents the customers given name
  string first_name = 3;
  // family_name represents the customers family name
  string family_name = 4;
  // email represents the email address of the customer
  string email = 5;
  // address is the users address for contact
  Address address = 6;
}

// The response message containing the greetings
message SignUpResponse {
  // success is either true for a successful login or incorrect, not further information given to prevent hacking knowledge
  bool success = 1;
}

message Address {
  // home_number_name represents the address number or name on the street
  string home_number_name = 1;
  // first_line represents the street
  string first_line = 2;
  // second_line represents an additional optional address if required
  optional string second_line = 3;
  // postcode represents the UK postcode
  optional string postcode = 4;
  // zipcode represents the rest of the world equivalent to the UK postcode
  optional string zipcode = 5;
}